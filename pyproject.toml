[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aid851-kgc-study"
version = "0.1.0"
description = "Leakage-aware comparative evaluation of embeddings and AnyBURL"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
neural = ["torch>=2.2,<3", "pykeen==1.11.1"]
analysis = ["pandas>=2.2,<4", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
kgc = "kgc.cli:main"
kgc-research = "kgc.research.runner:main"

[tool.setuptools.packages.find]
include = ["kgc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
